<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT 提问地图</title><link rel="stylesheet" href="popup.css"></head>
<body><div class="brand">QUESTION MAP · 1.1.0</div><h1>ChatGPT 提问地图</h1><p>每一个问题，都有迹可循。</p><label class="setting"><span>启用提问地图</span><input type="checkbox" id="enabled" checked></label><button id="toggle">展开 / 收起当前目录</button><p id="status" role="status">正在连接当前页面…</p><button id="diagnostics" class="secondary">查看诊断信息</button><textarea id="report" readonly hidden aria-label="诊断信息，可复制反馈" rows="12"></textarea><div class="help">在 ChatGPT 网页右侧悬停查看目录，点击问题即可跳转。<br><br>快捷键：<kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>M</kbd><br><br>点击目录内「收录更早提问」加载历史。已收录内容暂存在标签页内存，刷新后清空，内容不上传。</div><script src="popup.js"></script></body></html>
